<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALFABETIC · Aventura entre letras</title><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#f8f5ff;background:#100d27}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#30205b,#100d27 65%);min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible{outline:3px solid #ffdb7d;outline-offset:3px}.app{max-width:1060px;margin:auto;padding:22px 18px 55px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:clamp(24px,5vw,40px);font-weight:1000;letter-spacing:2px;color:#ffe88e;text-shadow:0 3px #7954a9}.muted{color:#c9c0df}.panel{background:#211a42;border:1px solid #55477f;border-radius:26px;padding:clamp(18px,4vw,32px);box-shadow:0 16px 40px #0004}.hero{text-align:center;padding:50px 15px}.hero h1{font-size:clamp(40px,9vw,84px);color:#ffe88e;margin:10px 0}.hero p{font-size:20px}.primary,.secondary,.choice{border-radius:16px;padding:13px 20px;font-weight:800;transition:transform .15s,background .15s}.primary{background:#fbd66c;color:#2d2241}.secondary{background:#47376e;color:white;border:1px solid #7765aa}.primary:hover,.secondary:hover,.choice:hover{transform:translateY(-2px)}.characters,.worlds,.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px;margin:25px 0}.character,.world{background:#312654;border:1px solid #65528d;border-radius:20px;padding:18px;text-align:center}.avatar{font-size:70px;line-height:1.2}.character h3,.world h3{margin:8px}.world{cursor:pointer;text-align:left}.world:hover{background:#43336f}.world .emoji{font-size:46px}.tag{display:inline-block;border-radius:999px;padding:5px 11px;background:#4b3a7d;color:#ffe88e;font-size:12px;font-weight:800}.heading{font-size:clamp(25px,5vw,38px);margin:15px 0}.bar{height:12px;background:#46375f;border-radius:20px;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:#fbd66c;transition:width .2s}.question{font-size:clamp(21px,4vw,31px);font-weight:800;margin:22px 0 12px}.hint{font-size:16px;color:#d7cde9}.options{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.choice{background:#f4eaff;color:#2a2140;min-height:82px;font-size:clamp(20px,3vw,29px)}.choice:disabled{opacity:.65;cursor:default}.choice.selected{background:#b6f2cc}.entry{padding:16px;border-radius:14px;width:100%;max-width:420px;border:3px solid #b6a2de;font-size:25px;text-transform:uppercase}.feedback{padding:18px;border-radius:17px;margin:16px 0;font-weight:700;background:#3e3366}.success{background:#235b4b}.error{background:#6b394d}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.stars{color:#ffda67;font-size:24px}.small{font-size:14px}.footer{margin-top:35px;text-align:center;color:#b5aacb;font-size:13px}.screen{animation:show .25s ease}@keyframes show{from{opacity:.3;transform:translateY(7px)}to{opacity:1;transform:none}}.pill{padding:7px 12px;border-radius:99px;background:#332750}.speak{background:#b9f0ff;color:#192c45;border-radius:14px;padding:12px 16px;font-weight:800}.mini{font-size:13px}.guide{display:flex;gap:14px;align-items:center;background:#332850;border-radius:18px;padding:13px;margin:16px 0}.guide .face{font-size:42px}.guide p{margin:4px 0}.notice{background:#43335f;padding:12px;border-radius:12px;margin-top:12px}a{color:#ffe88e}@media(max-width:560px){.app{padding:12px 12px 40px}.panel{border-radius:18px}.top{align-items:flex-start}.characters{grid-template-columns:1fr 1fr}.avatar{font-size:48px}.options{grid-template-columns:1fr 1fr}.choice{min-height:75px}}
</style></head><body><div class="app"><header class="top"><div class="brand">✦ ALFABETIC</div><div id="topActions"></div></header><main id="root" class="screen"></main><footer class="footer">ALFABETIC · Primera versión jugable · Tu aventura comienza con una letra ✨</footer></div><script>
'use strict';
const worlds=[{title:'El portal del diagnóstico',emoji:'🔮',desc:'Descubrimos lo que ya sabés',guide:'Mateo'},{title:'El bosque de las vocales',emoji:'🌳',desc:'Cinco sonidos mágicos',guide:'Ana'},{title:'La isla de las sílabas',emoji:'🏝️',desc:'Juntamos letras y sonidos',guide:'Mateo'},{title:'La ciudad de las palabras',emoji:'🏘️',desc:'Construimos palabras',guide:'Ana'},{title:'El puente de las oraciones',emoji:'🌉',desc:'Leemos para comprender',guide:'Mateo'}];
// kind: pick, type, arrange; prompt, options, answer, spoken, help
const levels=[
[
{kind:'pick',prompt:'¿Cuál de estas palabras rima con GATO?',options:['PATO','LUNA','MESA'],answer:'PATO',spoken:'¿Qué palabra rima con gato?'},
{kind:'pick',prompt:'¿Cuántas sílabas tiene PELOTA?',options:['2','3','4'],answer:'3',spoken:'Pe lo ta'},
{kind:'pick',prompt:'¿Qué palabra comienza con el sonido /m/?',options:['MESA','SOPA','PATO'],answer:'MESA',spoken:'Mmm. ¿Cuál empieza con mmm?'},
{kind:'pick',prompt:'¿Cuál es la vocal A?',options:['O','A','E','U'],answer:'A',spoken:'A'},
{kind:'pick',prompt:'¿Qué letra representa el sonido /s/?',options:['M','S','P'],answer:'S',spoken:'Ssss'},
{kind:'pick',prompt:'¿Cuál es la sílaba MA?',options:['PA','ME','MA'],answer:'MA',spoken:'Ma'},
{kind:'pick',prompt:'¿Cuál de estas palabras dice MESA?',options:['MISA','MESA','MASA'],answer:'MESA',spoken:'Mesa'},
{kind:'type',prompt:'Escuchá y escribí la palabra.',answer:'PATO',spoken:'Pato',help:'Tiene cuatro letras y empieza con P.'}
],
[
{kind:'pick',prompt:'Escuchá. ¿Qué vocal suena?',options:['A','E','O'],answer:'A',spoken:'A'},
{kind:'pick',prompt:'Escuchá. ¿Qué vocal suena?',options:['I','E','U'],answer:'E',spoken:'E'},
{kind:'pick',prompt:'Escuchá. ¿Qué vocal suena?',options:['I','A','O'],answer:'I',spoken:'I'},
{kind:'pick',prompt:'Escuchá. ¿Qué vocal suena?',options:['U','O','E'],answer:'O',spoken:'O'},
{kind:'pick',prompt:'Escuchá. ¿Qué vocal suena?',options:['U','A','I'],answer:'U',spoken:'U'},
{kind:'pick',prompt:'¿Con qué vocal empieza ABEJA? 🐝',options:['A','E','I'],answer:'A',spoken:'Abeja'},
{kind:'pick',prompt:'Completá: S _ L ☀️',options:['A','O','U'],answer:'O',spoken:'Sol'},
{kind:'type',prompt:'Escribí las cinco vocales en orden.',answer:'AEIOU',spoken:'A, E, I, O, U',help:'Comenzá por A y terminá con U.'}
],
[
{kind:'pick',prompt:'¿Qué letra hace el sonido /m/?',options:['M','N','P'],answer:'M',spoken:'Mmmm'},
{kind:'pick',prompt:'Uní M + A. ¿Qué sílaba se forma?',options:['ME','MA','MO'],answer:'MA',spoken:'M, A, MA'},
{kind:'pick',prompt:'Uní P + E. ¿Qué sílaba se forma?',options:['PE','PA','PI'],answer:'PE',spoken:'P, E, PE'},
{kind:'pick',prompt:'Uní L + I. ¿Qué sílaba se forma?',options:['LA','LO','LI'],answer:'LI',spoken:'L, I, LI'},
{kind:'pick',prompt:'Uní S + O. ¿Qué sílaba se forma?',options:['SA','SO','SU'],answer:'SO',spoken:'S, O, SO'},
{kind:'pick',prompt:'Uní T + U. ¿Qué sílaba se forma?',options:['TU','TA','TO'],answer:'TU',spoken:'T, U, TU'},
{kind:'pick',prompt:'Uní N + A. ¿Qué sílaba se forma?',options:['NE','NI','NA'],answer:'NA',spoken:'N, A, NA'},
{kind:'arrange',prompt:'Ordená las sílabas para formar MESA.',options:['SA','ME'],answer:'ME SA',spoken:'Mesa',help:'Primero escuchamos ME y después SA.'}
],
[
{kind:'arrange',prompt:'Ordená las sílabas para formar MAPA 🗺️',options:['PA','MA'],answer:'MA PA',spoken:'Mapa'},
{kind:'pick',prompt:'¿Qué palabra nombra este animal? 🐸',options:['SAPO','SOPA','PATO'],answer:'SAPO',spoken:'Sapo'},
{kind:'pick',prompt:'¿Cuál de estas palabras tiene dos sílabas?',options:['PELOTA','MESA','MARIPOSA'],answer:'MESA',spoken:'Mesa'},
{kind:'pick',prompt:'¿Qué palabra tiene tres sílabas?',options:['PATO','TOMATE','SOL'],answer:'TOMATE',spoken:'Tomate'},
{kind:'pick',prompt:'Completá: PA _ O 🦆',options:['T','M','S'],answer:'T',spoken:'Pato'},
{kind:'arrange',prompt:'Ordená las sílabas para formar PALOMA 🕊️',options:['MA','PA','LO'],answer:'PA LO MA',spoken:'Paloma'},
{kind:'type',prompt:'Escuchá y escribí la palabra.',answer:'LUNA',spoken:'Luna',help:'Empieza con L y tiene dos sílabas.'},
{kind:'type',prompt:'Escribí la palabra que escuchás.',answer:'TOMATE',spoken:'Tomate',help:'TO - MA - TE'}
],
[
{kind:'pick',prompt:'Leé: «LA MAMÁ TOMA MATE». ¿Qué toma?',options:['MATE','SOPA','AGUA'],answer:'MATE',spoken:'La mamá toma mate'},
{kind:'pick',prompt:'Leé: «EL SAPO SALTA». ¿Quién salta?',options:['EL PATO','EL SAPO','LA MAMÁ'],answer:'EL SAPO',spoken:'El sapo salta'},
{kind:'arrange',prompt:'Ordená la oración: «LA LUNA SALE».',options:['SALE','LA','LUNA'],answer:'LA LUNA SALE',spoken:'La luna sale'},
{kind:'pick',prompt:'Completá: «EL PATO ___».',options:['NADA','MESA','LUNA'],answer:'NADA',spoken:'El pato nada'},
{kind:'pick',prompt:'Escuchá. ¿Qué oración dije?',options:['LA MESA ES LILA','LA LUNA SALE','EL SAPO SALTA'],answer:'LA LUNA SALE',spoken:'La luna sale'},
{kind:'pick',prompt:'Leé: «ANA TOMA SOPA. LA SOPA ESTÁ TIBIA». ¿Qué come Ana?',options:['SOPA','TOMATE','PAN'],answer:'SOPA',spoken:'Ana toma sopa. La sopa está tibia'},
{kind:'pick',prompt:'Leé: «MATEO MIRA LA LUNA». ¿Qué mira Mateo?',options:['EL SOL','LA LUNA','LA MESA'],answer:'LA LUNA',spoken:'Mateo mira la luna'},
{kind:'type',prompt:'Escribí la palabra que falta: «LA ___ SALE».',answer:'LUNA',spoken:'La luna sale',help:'Es lo que vemos en el cielo por la noche.'}
]
];
const KEY='alfabetic-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};let state={page:'home',level:0,index:0,tries:0,feedback:null,selection:[],value:'',name:saved.name||''};const root=document.getElementById('root'),topActions=document.getElementById('topActions');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(KEY,JSON.stringify(saved))}function completed(l){return (saved.done?.[l]||[]).filter(Boolean).length}function total(){return worlds.reduce((a,_,i)=>a+completed(i),0)}function speak(t){if(!('speechSynthesis'in window)){alert('Este navegador no ofrece voz automática. Podés leer las instrucciones en pantalla.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=.78;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('es'));if(v)u.voice=v;speechSynthesis.speak(u)}function go(page){state.page=page;state.feedback=null;render();window.scrollTo(0,0)}function guide(name,message){return `<div class="guide"><div class="face">${name==='Ana'?'👩🏻‍🎤':'👦🏻‍🏫'}</div><div><strong>${name}</strong><p>${esc(message)}</p></div></div>`}function render(){topActions.innerHTML=state.page==='home'?'':`<button class="secondary" onclick="go('map')">🗺️ Mapa</button>`;root.className='screen';if(state.page==='home'){root.innerHTML=`<div class="hero"><div class="tag">UNA AVENTURA PARA APRENDER A LEER</div><h1>ALFABETIC</h1><p>¡Una aventura entre letras, sonidos y palabras!</p><div class="characters"><div class="character"><div class="avatar">👩🏻‍🎤</div><h3>ANA</h3><p>¡Hola! Me encanta descubrir palabras nuevas. ¿Nos acompañás?</p></div><div class="character"><div class="avatar">👦🏻‍🏫</div><h3>MATEO</h3><p>¡Hola! Vamos a aprender jugando. Te ayudaré cuando lo necesites.</p></div><div class="character"><div class="avatar">🧙🏻‍♂️</div><h3>LUXI</h3><p>¡Mis desafíos mágicos pondrán a prueba todo lo que sabés!</p></div></div><button class="primary" onclick="go('map')">✨ COMENZAR AVENTURA</button><p class="muted small">Tu progreso se guarda en este navegador.</p></div>`}else if(state.page==='map'){root.innerHTML=`<div class="panel"><div class="tag">MAPA DE AVENTURA</div><h1 class="heading">Elegí tu próximo mundo 🗺️</h1>${guide('Ana','Cada mundo tiene ocho desafíos. ¡Podés explorar, practicar y volver a intentarlo!')}<div class="bar"><div style="width:${total()/40*100}%"></div></div><p class="muted">${total()} de 40 desafíos completados · ${Math.round(total()/40*100)}%</p><div class="worlds">${worlds.map((w,i)=>`<button class="world" onclick="start(${i})"><div class="emoji">${w.emoji}</div><div class="tag">MUNDO ${i+1}</div><h3>${w.title}</h3><p>${w.desc}</p><div class="stars">${completed(i)===8?'⭐⭐⭐':'⭐'.repeat(Math.floor(completed(i)/3))}</div><p class="small muted">${completed(i)}/8 desafíos</p></button>`).join('')}</div><div class="actions"><button class="secondary" onclick="go('home')">Volver al inicio</button><button class="secondary" onclick="if(confirm('¿Borrar todo el progreso guardado?')){saved={};save();render()}">Reiniciar progreso</button></div></div>`}else if(state.page==='activity'){activity()}else if(state.page==='finish'){let l=state.level;root.innerHTML=`<div class="panel hero"><div style="font-size:85px">🏆</div><h1>¡Mundo completado!</h1><h2>${worlds[l].title}</h2><p>Terminaste los ocho desafíos. ¡Qué gran aventura!</p><div class="stars">⭐⭐⭐</div>${guide('Ana','Podés volver a jugar o visitar otro mundo. ¡Cada intento ayuda a aprender!')}<div class="actions" style="justify-content:center"><button class="primary" onclick="go('map')">🗺️ Volver al mapa</button><button class="secondary" onclick="start(${l})">🔁 Repetir mundo</button>${l<4?`<button class="secondary" onclick="start(${l+1})">Siguiente mundo ➜</button>`:''}</div></div>`}}function start(l){state.level=l;state.index=0;state.tries=0;state.selection=[];state.value='';state.feedback=null;go('activity')}function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase().replace(/\s+/g,' ')}function activity(){let l=state.level,i=state.index,q=levels[l][i],w=worlds[l];let interactive='';if(q.kind==='pick'){interactive=`<div class="options">${q.options.map(o=>`<button class="choice" ${state.feedback?'disabled':''} onclick="answer('${o}')">${esc(o)}</button>`).join('')}</div>`}else if(q.kind==='type'){interactive=`<input class="entry" id="entry" maxlength="60" aria-label="Escribí tu respuesta" placeholder="Escribí acá" value="${esc(state.value)}" ${state.feedback?'disabled':''}><div class="actions"><button class="primary" ${state.feedback?'disabled':''} onclick="answer(document.getElementById('entry').value)">Comprobar respuesta</button></div>`}else{interactive=`<p class="hint">Tocá las piezas en el orden correcto:</p><div class="options">${q.options.map((o,j)=>`<button class="choice" ${state.selection.includes(j)||state.feedback?'disabled':''} onclick="addPiece(${j})">${esc(o)}</button>`).join('')}</div><div class="notice">Tu respuesta: <strong>${state.selection.map(j=>esc(q.options[j])).join(' · ')||'…'}</strong></div><div class="actions"><button class="secondary" ${state.feedback?'disabled':''} onclick="state.selection=[];render()">Borrar selección</button><button class="primary" ${state.feedback?'disabled':''} onclick="answer(state.selection.map(j=>q.options[j]).join(' '))">Comprobar</button></div>`}root.innerHTML=`<div class="panel"><div class="tag">${w.emoji} NIVEL ${l+1}</div><h1 class="heading">${w.title}</h1><div class="muted">Desafío ${i+1} de 8</div><div class="bar"><div style="width:${(i+1)/8*100}%"></div></div>${guide(w.guide,i===0?'¡Empezamos! Escuchá, pensá y elegí tu respuesta.':'¡Muy bien! Seguimos descubriendo nuevas palabras.')}<div class="question">${esc(q.prompt)}</div><button class="speak" onclick="speak(levels[state.level][state.index].spoken||levels[state.level][state.index].prompt)">🔊 Escuchar</button>${q.help?`<p class="hint">💡 Pista: ${esc(q.help)}</p>`:''}${interactive}${state.feedback?`<div class="feedback ${state.feedback.correct?'success':'error'}" role="status">${state.feedback.correct?'🌟 ¡Muy bien! Respuesta correcta.':'💜 Todavía no. ¡Podés intentarlo otra vez!'}${!state.feedback.correct&&state.tries>=2?`<p>Una ayuda: la respuesta es <strong>${esc(q.answer)}</strong>.</p>`:''}</div>`:''}<div class="actions">${state.feedback?.correct?`<button class="primary" onclick="next()">${i===7?'Terminar mundo 🏆':'Siguiente desafío ➜'}</button>`:state.feedback?`<button class="primary" onclick="retry()">Volver a intentar ↻</button>`:''}<button class="secondary" onclick="go('map')">Salir al mapa</button></div><p class="muted mini">Las voces dependen del navegador. Si no se escuchan, podés leer las instrucciones.</p></div>`}function addPiece(j){if(!state.selection.includes(j)){state.selection.push(j);render()}}function answer(value){let q=levels[state.level][state.index];if(state.feedback?.correct)return;if(!norm(value))return;let correct=norm(value)===norm(q.answer);state.tries++;state.value=value;state.feedback={correct};if(correct){saved.done??={};saved.done[state.level]??=Array(8).fill(false);saved.done[state.level][state.index]=true;saved.attempts??={};saved.attempts[`${state.level}-${state.index}`]=(saved.attempts[`${state.level}-${state.index}`]||0)+state.tries;save()}render();if(correct)speak('¡Muy bien!')}function retry(){state.feedback=null;state.selection=[];state.value='';render()}function next(){if(state.index===7){go('finish')}else{state.index++;state.tries=0;state.selection=[];state.value='';state.feedback=null;render()}}window.go=go;window.start=start;window.answer=answer;window.retry=retry;window.next=next;window.addPiece=addPiece;window.speak=speak;window.render=render;render();
</script></body></html>
